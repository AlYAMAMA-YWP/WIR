<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071933"/>
      <stop offset="28%" stop-color="#0D2C54"/>
      <stop offset="52%" stop-color="#1A4B84"/>
      <stop offset="76%" stop-color="#0E305C"/>
      <stop offset="100%" stop-color="#071933"/>
    </linearGradient>
    <radialGradient id="duskGlow" cx="52%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#133B6B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#061428" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071933" stop-opacity="0.96"/>
      <stop offset="22%" stop-color="#0B2545" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0B2545" stop-opacity="0.25"/>
      <stop offset="78%" stop-color="#0B2545" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#071933" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="160" fill="url(#skyBg)"/>
  <rect width="1440" height="160" fill="url(#duskGlow)"/>

  <!-- Atmospheric cloud wisps -->
  <ellipse cx="420" cy="46" rx="180" ry="12" fill="#3B82F6" opacity="0.12"/>
  <ellipse cx="960" cy="38" rx="220" ry="14" fill="#60A5FA" opacity="0.10"/>

  <!-- Far background Jeddah waterfront skyline -->
  <g fill="#0A2040" opacity="0.72">
    <rect x="210" y="92" width="22" height="44"/>
    <rect x="242" y="80" width="28" height="56"/>
    <rect x="282" y="96" width="18" height="40"/>
    <rect x="330" y="70" width="24" height="66"/>
    <rect x="366" y="88" width="20" height="48"/>
    <rect x="440" y="64" width="26" height="72"/>
    <rect x="478" y="82" width="19" height="54"/>
    <rect x="550" y="75" width="32" height="61"/>
    <rect x="640" y="84" width="22" height="52"/>
    <rect x="760" y="72" width="28" height="64"/>
    <rect x="820" y="86" width="20" height="50"/>
    <rect x="920" y="68" width="30" height="68"/>
    <rect x="990" y="80" width="24" height="56"/>
    <rect x="1080" y="76" width="26" height="60"/>
    <rect x="1150" y="88" width="22" height="48"/>
  </g>

  <!-- Main Jeddah Corniche towers & signature needle spire -->
  <g fill="#0E2B52">
    <rect x="260" y="74" width="20" height="62" rx="1"/>
    <rect x="305" y="58" width="24" height="78" rx="1"/>
    <polygon points="317,44 329,58 305,58"/>
    <rect x="392" y="54" width="28" height="82" rx="1"/>
    <rect x="505" y="48" width="26" height="88" rx="1"/>
    <rect x="595" y="62" width="30" height="74" rx="1"/>
    <!-- Signature tall Jeddah waterfront tower -->
    <polygon points="712,14 720,136 704,136" fill="#143D73"/>
    <rect x="710" y="8" width="3" height="10" fill="#60A5FA" opacity="0.8"/>
    <rect x="684" y="58" width="18" height="78"/>
    <rect x="726" y="64" width="20" height="72"/>
    <!-- Modern curved high-rises -->
    <path d="M852 136 L852 46 Q866 36 878 48 L878 136 Z" fill="#103360"/>
    <rect x="890" y="56" width="24" height="80"/>
    <rect x="955" y="42" width="28" height="94"/>
    <polygon points="969,28 983,42 955,42" fill="#154078"/>
    <rect x="1030" y="64" width="22" height="72"/>
    <rect x="1115" y="58" width="26" height="78"/>
  </g>

  <!-- Subtle glowing tower windows -->
  <g fill="#FBBF24" opacity="0.55">
    <rect x="310" y="64" width="3" height="2"/><rect x="318" y="64" width="3" height="2"/>
    <rect x="310" y="72" width="3" height="2"/><rect x="318" y="78" width="3" height="2"/>
    <rect x="398" y="62" width="4" height="2"/><rect x="408" y="68" width="4" height="2"/>
    <rect x="398" y="76" width="4" height="2"/><rect x="408" y="84" width="4" height="2"/>
    <rect x="512" y="58" width="4" height="2"/><rect x="520" y="66" width="4" height="2"/>
    <rect x="512" y="74" width="4" height="2"/><rect x="520" y="84" width="4" height="2"/>
    <rect x="604" y="70" width="4" height="2"/><rect x="614" y="78" width="4" height="2"/>
    <rect x="710" y="42" width="3" height="3"/><rect x="710" y="56" width="3" height="3"/><rect x="710" y="72" width="3" height="3"/>
    <rect x="860" y="58" width="4" height="2"/><rect x="866" y="68" width="4" height="2"/>
    <rect x="860" y="78" width="4" height="2"/><rect x="898" y="66" width="4" height="2"/>
    <rect x="962" y="52" width="4" height="2"/><rect x="970" y="60" width="4" height="2"/>
    <rect x="962" y="68" width="4" height="2"/><rect x="970" y="78" width="4" height="2"/>
    <rect x="1122" y="66" width="4" height="2"/><rect x="1130" y="74" width="4" height="2"/>
  </g>
  <g fill="#93C5FD" opacity="0.45">
    <rect x="688" y="68" width="3" height="2"/><rect x="694" y="76" width="3" height="2"/>
    <rect x="730" y="72" width="4" height="2"/><rect x="738" y="82" width="4" height="2"/>
    <rect x="1036" y="72" width="3" height="2"/><rect x="1042" y="80" width="3" height="2"/>
  </g>

  <!-- Red Sea Corniche water strip & reflections -->
  <rect x="0" y="134" width="1440" height="26" fill="url(#seaGrad)"/>
  <line x1="0" y1="134" x2="1440" y2="134" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#FBBF24" stroke-opacity="0.32" stroke-width="1.5">
    <line x1="312" y1="140" x2="324" y2="140"/>
    <line x1="510" y1="143" x2="528" y2="143"/>
    <line x1="704" y1="141" x2="722" y2="141"/>
    <line x1="708" y1="147" x2="718" y2="147"/>
    <line x1="860" y1="142" x2="876" y2="142"/>
    <line x1="960" y1="144" x2="978" y2="144"/>
  </g>

  <!-- Soft overlay gradient so header text stays crisp -->
  <rect width="1440" height="160" fill="url(#edgeFade)"/>
</svg>
